spring.jpa.hibernate.ddl-auto=create
#spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.flyway.enabled=true

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
#
spring.flyway.baseline-on-migrate=true
service.statistic.delay=${STATISTIC_DELAY:30000}

statistics.observability=true

observability.intervals=${OBSERVABILITY_INTERVALS:10,30,60}

service.statistic.observability.delay=${STATISTIC_DELAY:30000}

# Kafka
# Kafka Configuration
kafka.hosts=${KAFKA_HOSTS:localhost:9092}
kafka.groupId=${KAFKA_GROUP_ID:module1-group}
kafka.topic=${KAFKA_TOPIC:module1-entities}
kafka.concurrency=${KAFKA_CONCURRENCY:3}

# ??? ????????? ?????????? (???? ?????)
spring.kafka.properties.security.protocol=PLAINTEXT