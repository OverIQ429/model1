services:
  app:
    image: socialnetwork
    deploy:
      resources:
        limits:
          cpus: '1.0'  # Начальное значение - 1 ядро
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    container_name: spring-boot-app
    restart: always
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      - app-network
    environment:
      DB_URL: jdbc:postgresql://10.60.3.26:5432/Social-NetWork
      DDL_AUTO: ${DDL_AUTO:-validate}
      SHOW_SQL: ${SHOW_SQL:-true}
      DB_HOST: ${DB_HOST:-database}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-Social-NetWork}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_DIALECT: ${DB_DIALECT:-org.hibernate.dialect.PostgreSQLDialect}
      TOMCAT_MAX_THREADS: ${TOMCAT_MAX_THREADS:-200}  # Правильный синтаксис
      READ_WRITE_RATIO: ${READ_WRITE_RATIO:-50_50} # Правильный синтаксис

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    networks:
      - app-network

  additional-service:
    image: additional-service:1.0.0  # Укажите имя вашего образа additional-service
    container_name: additional-service-app
    restart: always
    ports:
      - "8081:8081"
    networks:
      - app-network
    environment:
      DB_URL: jdbc:postgresql://10.60.3.26:5432/Social-NetWork
      DB_USERNAME: ${DB_USERNAME:-jimmy}
      DB_PASSWORD: ${DB_PASSWORD:-jimmy}
      SERVER_PORT: 8081
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
volumes:
  db_data:

networks:
  app-network:
    driver: bridge